{{define "gmlogin.html"}}<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập GM — {{.Game}}</title>
<style>
 :root{--nen:#0C1D2B;--the:#122636;--vien:#22394D;--chu:#E4EDF3;--mo:#9CB0C0;--nhan:#EE4623}
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:var(--nen);color:var(--chu);font:16px/1.6 ui-sans-serif,system-ui,sans-serif;padding:20px}
 form{width:100%;max-width:380px;background:var(--the);border:1px solid var(--vien);border-radius:6px;padding:26px}
 h1{font-size:20px;margin:0 0 4px} p.sub{color:var(--mo);font-size:14px;margin:0 0 20px}
 label{display:block;font-size:13.5px;color:var(--mo);margin:14px 0 6px}
 input{width:100%;padding:11px 12px;font-size:16px;border-radius:4px;border:1px solid var(--vien);
       background:#0d1f2e;color:var(--chu)}
 input:focus{outline:2px solid var(--nhan);outline-offset:-1px}
 button{width:100%;margin-top:20px;padding:12px;font-size:16px;font-weight:600;cursor:pointer;
        border:0;border-radius:4px;background:var(--nhan);color:#fff}
 .loi{margin-top:14px;padding:10px 12px;border-radius:4px;font-size:14px;background:#3A1E1A;color:#E0685A}
</style></head>
<body>
<form method="post" action="/admin-portal/dang-nhap" autocomplete="off">
  <h1>Công cụ GM</h1>
  <p class="sub">Game <strong>{{.Game}}</strong> — dùng tài khoản nhân viên của hệ thống</p>
  <label for="u">Tài khoản</label>
  <input id="u" name="username" autocapitalize="off" autocorrect="off" required autofocus>
  <label for="p">Mật khẩu</label>
  <input id="p" name="password" type="password" required>
  <button type="submit">Đăng nhập</button>
  {{if .Error}}<div class="loi">Tài khoản hoặc mật khẩu không đúng.</div>{{end}}
</form>
</body></html>{{end}}
