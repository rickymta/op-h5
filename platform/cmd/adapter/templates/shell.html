{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/assets/images/favicon.png">
<style>
  /* Bảng màu lấy từ chính game: #EE4623 đã là màu chủ đạo của trang cũ.
     Nền biển đêm cho hợp chủ đề hải trình; vàng đồng cho các mốc thông tin. */
  :root{
    --abyss:#07121C; --deep:#0C1D2B; --panel:#122636; --panel-2:#18304291;
    --foam:#E4EDF3; --mist:#9CB0C0; --line:#22394D;
    --brand:#EE4623; --brand-dim:#C4381B; --brass:#D9A945;
    --smooth:#3FB89F; --busy:#E0A63F; --full:#E0685A;
    --smooth-bg:#123A34; --busy-bg:#332812; --full-bg:#3A1E1A;
    --body:"SVN-Poppins",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  @font-face{font-family:"SVN-Poppins";src:url(/assets/fonts/SVN-Poppins-Regular.ttf) format("truetype");
             font-weight:400;font-display:swap}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--abyss);color:var(--foam);font:16px/1.6 var(--body);
       -webkit-font-smoothing:antialiased}
  a{color:var(--brass);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---- thanh điều hướng ---- */
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;
       padding:12px 26px;background:rgba(7,18,28,.86);backdrop-filter:blur(10px);
       border-bottom:1px solid var(--line)}
  .top .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;
             color:var(--foam);font-size:16px}
  .top .logo img{height:30px;width:auto;display:block}
  .top nav{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:14.5px}
  .top nav a{color:var(--mist)} .top nav a:hover{color:var(--foam);text-decoration:none}
  .who{font-family:var(--mono);font-size:12.5px;color:var(--brass)}

  .btn{display:inline-block;padding:11px 22px;border:0;border-radius:3px;cursor:pointer;
       font:600 15px/1 var(--body);color:#fff;background:var(--brand);letter-spacing:.01em}
  .btn:hover{background:var(--brand-dim);text-decoration:none}
  .btn.ghost{background:transparent;color:var(--brass);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--panel)}
  .btn.lg{padding:14px 34px;font-size:17px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  main{max-width:1000px;margin:0 auto;padding:0 24px 72px}
  section{padding-top:52px}
  h1{font-size:clamp(30px,5vw,46px);line-height:1.06;letter-spacing:-.025em;margin:0 0 14px;
     text-wrap:balance}
  h2{font-size:22px;letter-spacing:-.015em;margin:0 0 6px}
  .lead{color:var(--mist);font-size:17px;max-width:56ch;margin:0 0 26px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
           color:var(--brass);margin:0 0 10px}
  .sub{color:var(--mist);font-size:14px;margin:0 0 20px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px 24px}

  /* ---- dải trạng thái máy chủ ---- */
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:500;
        padding:3px 9px;border-radius:2px;white-space:nowrap;letter-spacing:.04em}
  .pill.smooth{background:var(--smooth-bg);color:var(--smooth)}
  .pill.busy{background:var(--busy-bg);color:var(--busy)}
  .pill.full{background:var(--full-bg);color:var(--full)}
  .pill.unknown{background:var(--panel-2);color:var(--mist)}

  .srv{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;
       padding:13px 0;border-bottom:1px solid var(--line)}
  .srv:last-child{border-bottom:0}
  .srv .nm{font-weight:600}
  .srv .code{font-family:var(--mono);font-size:12px;color:var(--mist);margin-left:8px}
  .srv .load{font-family:var(--mono);font-size:12.5px;color:var(--mist);
             font-variant-numeric:tabular-nums;text-align:right;min-width:78px}

  .msg{padding:11px 14px;font-size:14px;border-left:3px solid;margin:0 0 16px;border-radius:2px}
  .msg.err{background:var(--full-bg);color:var(--full);border-color:var(--full)}
  .msg.ok{background:var(--smooth-bg);color:var(--smooth);border-color:var(--smooth)}
  .msg.warn{background:var(--busy-bg);color:var(--busy);border-color:var(--busy)}

  .muted{color:var(--mist)}
  footer{border-top:1px solid var(--line);margin-top:60px;padding:22px 26px;
         color:var(--mist);font-size:13px;text-align:center}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  /* ---- man hinh hep (dien thoai) ----
     Game nay chu yeu choi tren dien thoai, nen day khong phai truong hop bien.
     Truoc khi co khoi nay: o 375px thanh dieu huong rong 409px — ten site xuong 3 dong,
     lien ket "Thoat" bi cat mat, va ca trang cuon ngang duoc (scrollWidth 408).
     Vung cham cua lien ket cung chi cao 23px, duoi muc 44px de bam trung bang ngon tay. */
  @media (max-width:560px){
    .top{flex-wrap:wrap; gap:8px 14px; padding:10px 16px}
    .top .logo{font-size:15px; gap:8px}
    .top .logo img{height:26px}
    /* Khong day nav xuong dong rieng bang margin-left:auto nua: o day nav tu xuong dong
       khi khong du cho, va can trai cho thang hang voi noi dung ben duoi. */
    .top nav{margin-left:0; width:100%; gap:6px 16px; flex-wrap:wrap; font-size:15px}
    /* 44px la nguong bam trung bang ngon tay; padding doc lo ra vung cham do ma khong
       lam thanh dieu huong cao them. */
    .top nav a, .top nav form button{min-height:44px; display:inline-flex; align-items:center}
    .who{font-size:13px}
    main{padding:0 16px 56px}
    section{padding-top:32px}
    .panel{padding:18px 16px}
    /* Bang/hang may chu: xuong dong thay vi tran ra ngoai. */
    .srv{flex-wrap:wrap; gap:6px 10px}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
{{end}}

{{define "nav"}}
<header class="top">
  <a class="logo" href="/"><img src="/assets/images/logo.png" alt=""> Đại Hải Trình</a>
  <nav>
    <a href="/may-chu">Máy chủ</a>
    <a href="/cua-hang">Cửa hàng</a>
    {{if .User}}
      <span class="who">{{.User}}</span>
      <a href="/auth/logout">Thoát</a>
    {{else}}
      <a href="/choi-game">Đăng nhập</a>
    {{end}}
  </nav>
</header>
{{end}}

{{define "foot"}}
<footer>Đại Hải Trình · một tài khoản dùng chung cho mọi game trên hệ thống</footer>
{{end}}
