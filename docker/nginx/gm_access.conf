# Ai duoc vao cong cu GM.
#
# QUYET DINH CUA NGUOI VAN HANH (2026-09-06): MO RA INTERNET, chi dua vao dang nhap GM.
# Truoc do file nay chi cho loopback va phai vao bang SSH tunnel.
#
# Rui ro da duoc neu va nguoi van hanh chap nhan:
#   - Cac trang GM phat vat pham, gui thu toan server, sinh CDK, nap tay.
#   - Tang PHP nay noi chuoi SQL truc tiep tu $_GET/$_POST, chi duoc che bang regex
#     StopAttack() chu khong phai prepared statement (CLAUDE.md muc 12).
#
# Cac lop con lai dang bao ve cho nay:
#   - Tai khoan that trong bang platform.gm_users: mat khau bam bcrypt, khoa tam 15 phut
#     sau 8 lan sai lien tiep, moi thao tac ghi vao gm_audit.
#   - Gioi han tan suat o duoi: chong do mat khau tu dong.
#
# Muon quay ve chi cho mot dia chi co dinh: thay `allow all;` bang
#   allow <IP>;
#   deny all;
allow all;

# Chong do mat khau: 12 request/phut cho moi IP, cho phep don 20 request lien tiep.
# Vung `gm_login` khai bao o cap http trong game.conf.
limit_req zone=gm_login burst=20 nodelay;
limit_req_status 429;
