# Ai duoc vao cong cu GM. Mac dinh: CHI loopback.
#
# Cac trang GM phat vat pham, gui thu toan server, sinh CDK, nap tay. Chung da co tai
# khoan rieng (bang gm_users, mat khau bam bcrypt, co nhat ky) — nhung mot lop nua khong
# bao gio thua o cho tao ra gia tri trong game.
#
# Vao bang SSH tunnel:
#   ssh -L 8080:127.0.0.1:8080 root@<server>   roi mo http://127.0.0.1:8080/gmhanglong/
#
# Mo cho mot dia chi co dinh (van phong) thi them dong `allow <IP>;` TRUOC `deny all`.
allow 127.0.0.1;
allow ::1;
deny all;
