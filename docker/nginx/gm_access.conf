# Ai duoc vao CONG CU GM CU viet bang PHP (/gmhanglong/, /gm/).
#
# 2026-09-06: dong lai, CHI LOOPBACK. Truoc do la `allow all`.
#
# Vi sao dong: tang PHP nay noi chuoi SQL thang tu $_GET/$_POST, chi duoc che bang regex
# StopAttack() chu khong phai prepared statement (CLAUDE.md muc 12) — ma chinh no phat vat
# pham, gui thu toan server, nap tay. Bon thao tac do gio da co ban Go/React trong dich vu
# `admin` (truy van tham so hoa, nhat ky admin_audit), mo o https://admin.<domain> va
# https://haitac.<domain>/admin-portal. Nen giu PHP mo ra Internet khong doi lay them gi.
#
# Cai CHUA co ban Go, vi vay file nay chua bi xoa han: quan ly CDK (gmhanglong/cdk/,
# gmhanglong/pay/). Vao bang SSH tunnel khi can:
#   ssh -L 8080:127.0.0.1:80 root@<server>
#   http://127.0.0.1:8080/gmhanglong/gm/
#
# Muon mo cho mot dia chi co dinh: them `allow <IP>;` phia tren `deny all;`.
allow 127.0.0.1;
deny all;

# Chong do mat khau cho phan PHP con lai. Vung `gm_login` khai bao o cap http trong game.conf.
limit_req zone=gm_login burst=20 nodelay;
limit_req_status 429;
