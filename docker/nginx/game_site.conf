# Than cua site game — dung chung cho moi khoi `server` phuc vu no.
#
# Tach ra khoi game.conf de khoi domain (domains.conf) khong phai chep lai ~90 dong
# rewrite: chep lai la chac chan co ngay hai ban lech nhau.
#
# KHONG chua `listen`/`server_name`: hai dong do khac nhau o tung khoi server.
    root /www/wwwroot/game;
    index play.php index.php;
    charset utf-8;

    client_max_body_size 8m;

    gzip on;
    # `text/javascript` phai co: Go tra bundle SPA voi kieu do (net/http doan tu duoi .js),
    # nen thieu no thi 299 KB JavaScript di nguyen khong nen — do that: tai nguoi 314 KB thay
    # vi 105 KB. Bundle client LayaAir cu do nginx phuc vu tinh thi lai duoc nen, nen loi nay
    # rat de bo qua khi chi nhin trang game cu.
    gzip_types text/plain text/css text/javascript application/json application/javascript
               application/octet-stream image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # ---- Adapter (Go, :8090) ----
    # Trang chu, danh sach may chu, quy doi va luong dang nhap OIDC do Adapter phuc vu:
    # so lieu tren do la SONG, den tu chinh bo dem tai ma cong gioi han dang dung.
    # Dung `=` va `^~` de cac duong nay thang truoc regex `\.php$` ben duoi; con
    # /api/config.php, /api/getSession.php... van roi ve PHP nhu cu.
    # `= /` khop tuyet doi nen THANG ca `location /` ben duoi — va client nối WebSocket
    # dung vao path nay (`wss://<host>:443/`), nen nhanh Upgrade phai nam o day.
    location = / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $op_conn;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # $op_goc_backend do `map` trong game.conf quyet dinh (Adapter, hoac tien trinh
        # game khi la yeu cau nang cap WebSocket).
        proxy_pass $op_goc_backend;
    }
    location = /may-chu     { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location = /quy-doi     { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location = /cua-hang    { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location = /choi-game   { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location ^~ /auth/      { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location ^~ /api/game/  { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    # Giao dien React cua trang game (web/site/apps/haitac): /cua-hang/{id}, /gioi-thieu,
    # /huong-dan, /faq, /tin-tuc, /tin-tuc/{id}, va tai san /app/* (Vite assetsDir "app" —
    # /assets/ va regex \.(js|css)$ ben duoi da thuoc client LayaAir). `^~` de thang regex
    # .js/.css cho /app/*.js. Them mot duong moi cho trang thi phai them mot `location` o day:
    # `location /` cua host nay di ve play.php cua tang PHP cu, khong ve Adapter.
    location ^~ /cua-hang/  { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location = /gioi-thieu  { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location = /huong-dan   { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location = /faq         { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location = /tin-tuc     { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location ^~ /tin-tuc/   { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location ^~ /app/       { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }

    # ---- Anh thuong hieu cua tung game (bia, key visual, logo) ----
    # Nam NGOAI image: compose mount ${ASSETS_DIR}/brand -> /www/wwwroot/game/brand. Them game moi
    # thi chep anh vao ASSETS_DIR/brand/<game>/ va dien URL /brand/<game>/... o trang quan tri,
    # khong build lai image. Ten file khong bam nen chi cache 7 ngay.
    location ^~ /brand/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ---- Nut mua TRONG GAME (docs/design-cua-hang.md muc 1.5 va 4.2) ----
    # Client goi /api/api.php?payid= de hoi "du Xu khong" (true/false) truoc khi hien nut mua.
    # Game server (PayWithTokenMoneyReq trong tcg-game.jar) goi
    #   http://hakihuyenthoai.net/api/apisv.php?payid=&user=   (domain HARDCODE trong bytecode)
    # va phat hang khi body dung bang "true". Compose ghim hakihuyenthoai.net -> 127.0.0.1
    # (extra_hosts) nen request do den day qua loopback; chi loopback moi duoc goi — ai tra
    # duoc "true" cho duong nay la mua mien phi ca shop.
    location = /api/api.php {
        proxy_pass http://127.0.0.1:8090/api/game/legacy/check;
        include /etc/nginx/adapter_proxy.conf;
    }
    location = /api/apisv.php {
        allow 127.0.0.1; allow ::1; deny all;
        proxy_pass http://127.0.0.1:8090/api/game/legacy/charge;
        include /etc/nginx/adapter_proxy.conf;
    }

    # ---- Thay cho cac cong truc tiep (server chi mo 80/443) ----
    #
    # Client goi meta/statistic/login/WebSocket theo CONG. Tren server that chi co 80 va
    # 443, va khi trang chay HTTPS thi trinh duyet chan noi dung hon hop — nen bon duong
    # duoi day thay cho bon cong do. Xem docs/deploy-runbook.md muc "Tro domain that".
    #
    # /meta/ va /stat/: a3b31-4c087-1dc2f.js da doi sang location.origin + "/meta/" | "/stat/".
    location ^~ /meta/ {
        proxy_pass http://127.0.0.1:12345/;
        include /etc/nginx/adapter_proxy.conf;
    }
    location ^~ /stat/ {
        proxy_pass http://127.0.0.1:7788/;
        include /etc/nginx/adapter_proxy.conf;
    }

    # Login server. Client dung base tu tcg.srv_login roi noi them /account/... va /srv/...
    # nen dat np_port=443, np_scheme=https la hai duong nay ve dung cho.
    #
    # /srv/game/connect/target la NGOAI LE: Adapter phuc vu de viet lai host/port/scheme
    # cua WebSocket (khong the doi srv_game.ws_port thanh 443 vi do cung la cong tien
    # trinh game bind vao). Dat TRUOC `^~ /srv/` de duong cu the thang duong chung.
    location = /srv/game/connect/target {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/adapter_proxy.conf;
    }
    location ^~ /account/ { proxy_pass http://127.0.0.1:9000; include /etc/nginx/adapter_proxy.conf; }
    # Nhip tim cua tien trinh game goi vao login server, 8 giay mot lan. No mang bi mat
    # dung chung TRONG QUERY STRING (`?secret=...`) — do la giao thuc cua cum Java, khong
    # sua duoc vi khong co ma nguon. Hau qua: moi nhip ghi bi mat nguyen van vao access log,
    # ~10.800 dong mot ngay. Tat log cho DUNG duong nay; cac duong /srv/ khac van ghi log
    # binh thuong.
    #
    # Luu y: goi nay den tu chinh may nay (game server tro ve ten mien cong khai theo
    # loginNP trong global.conf.json), khong phai tu ben thu ba. Khong duoc chan — chan la
    # login server ngung nhan nhip va coi may chu da chet.
    location = /srv/game/active {
        access_log off;
        proxy_pass http://127.0.0.1:9000;
        include /etc/nginx/adapter_proxy.conf;
    }
    location ^~ /srv/     { proxy_pass http://127.0.0.1:9000; include /etc/nginx/adapter_proxy.conf; }

    # WebSocket cua tien trinh game.
    #
    # `/game` la truong `path` login server tra ve, NHUNG client nay khong dung no: engine
    # LayaAir goi Socket.connect(host, port) va tu ghep "ws://" + host + ":" + port — khong
    # bao gio them path. Da do that: client nối `ws://haitac.<domain>:443/`, tuc path GOC.
    # Vi vay phai bat WebSocket o `location /` (xem cuoi file); khoi nay giu lai cho tuong
    # thich neu ban client khac co gui path.
    location = /game {
        proxy_pass http://127.0.0.1:8001;

        # Ba dong bat buoc cho WebSocket; thieu mot dong la bat tay that bai im lang.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Phien game keo dai; mac dinh 60s se cat ngang nguoi dang choi.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ---- route dep: nguyen van rewrite goc cua server cu ----
    # Dat o muc server nen chay TRUOC khi chon location; "/" khong bi rewrite nen van ve Adapter.
    # /user-<act> va /act-<act> -> api/config.php?act=<act>: login-reg.php post /user-mlogin,
    # /user-mreg; taikhoan.php goi /act-pwd, /act-email; nhanxu.php /act-nhanxu; index.php /act-card.
    rewrite ^/play-game$        /play.php;
    rewrite ^/v2$               /hiente.php;
    rewrite ^/play.html$        /play.php;
    rewrite ^/user-(.*)$        /api/config.php?act=$1;
    rewrite ^/act-(.*)$         /api/config.php?act=$1;
    rewrite ^/get/(.*)$         /api/get.php?act=$1;        # dich khong co trong snapshot (404 nhu server cu)
    rewrite ^/gets/(.*)$        /api/gets.php?act=$1;       # nt
    rewrite ^/buy$              /api/buy.php;               # nt
    rewrite ^/tich$             /api/tich.php;              # nt
    rewrite ^/gift$             /api/giftcode.php;          # nt
    rewrite ^/card$             /api/card.php;
    rewrite ^/tai-khoan$        /user/index.php;
    rewrite ^/chinh-sach.html$  /dieukhoan.php;             # dich khong co; chinhsach.html thi co
    rewrite ^/lich-su$          /user/index.php?page=lichsu;
    rewrite ^/nhan-xu$          /user/index.php?page=nhanxu;
    rewrite ^/nap-tien$         /user/index.php?page=naptien;
    rewrite ^/doi-knb$          /user/index.php?page=doiknb;
    rewrite ^/tich-luy$         /user/index.php?page=tichluy;
    rewrite ^/web-shop$         /user/index.php?page=webshop;
    rewrite ^/webshop$          /user/index.php?page=webshop;    # bi danh them cua ban docker
    rewrite ^/gg_oauth$         /api/google_oauth/index.php;      # thu muc khong co trong snapshot
    rewrite ^/fb_oauth$         /api/facebook_oauth/index.php;    # nt
    rewrite ^/fb_callback$      /api/facebook_oauth/callback.php; # nt
    rewrite ^/oauth/(.*)$       /api/genSession.php?username=$1;  # file khong co trong snapshot
    location = /user        { rewrite ^ /user/index.php last; }

    # ---- 4 duong /user/*.php: khong ton tai tren server cu (404). Giu map tam ve config.php
    # vi user/index.php va indexapk.php van tham chieu chung; vo hai neu khong ai goi.
    location = /user/login.php       { rewrite ^ /api/config.php?act=login last; }
    location = /user/register.php    { rewrite ^ /api/config.php?act=reg   last; }
    location = /user/quenmatkhau.php { rewrite ^ /api/config.php?act=pwd   last; }
    location = /user/email.php       { rewrite ^ /api/config.php?act=email last; }

    # ---- manifest va loader: KHONG immutable ----
    # Manifest la bang "ten logic -> ten bam"; doi mot tai nguyen la doi manifest, ma loader
    # fetch no bang URL co dinh. De immutable 30d thi nguoi choi cu khong bao gio thay tai
    # nguyen moi. `location =` thang khoi regex ben duoi. Van con ETag de tai lai co dieu kien.
    location = /libs/2af72-f100c-2af72.json { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /libs/795bf-bff72-0d910.js   { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # ---- tai nguyen client: cache dai, ten file da bam ----
    location ~* ^/(res|libs|spine|sound|bmFont|icon|iconshop|img)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|css|js|json|ttf|woff2?|wav|mp3|sk)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # getSession.php nhan mat khau qua query string (hop dong cua bundle client, chua
    # doi duoc). Tat access_log cho rieng duong dan nay de mat khau khong nam trong log.
    location = /api/getSession.php {
        access_log off;
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9001;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # ---- PHP ----
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9001;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # Client nối WebSocket vao PATH GOC (xem ghi chu o `location = /game`), nen phai bat
    # o day. Phan biet bang header Upgrade chu khong bang duong dan: request thuong van
    # ra play.php nhu cu.
    location / {
        # Chi nhanh nay moi proxy, nen dat "upgrade" thang khong can map $connection_upgrade
        # o cap http (file nay duoc include vao trong `server`, khong sua duoc cap http).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        try_files $uri $uri/ /play.php;
    }

    # ---- Cong GM cua RIENG game nay ----
    #
    # Phan chia da thong nhat:
    #   admin.<domain>                 quan tri TOAN HE THONG — CMS, nap tien cho he thong
    #                                  ID, tai khoan chung, cau hinh cua hang
    #   haitac.<domain>/admin-portal   GM cua RIENG game haitac  <-- khoi nay
    #
    # Ly do ky thuat: moi thao tac GM di qua CONSOLE cua cum tcg — thu chi game nay co.
    # Game them vao sau se co backend khac han, nen cong GM phai thuoc stack cua tung game.
    # Adapter phuc vu tai cho (platform/cmd/adapter/adminportal.go + internal/gmops).
    #
    # Truoc day khoi nay `return 302` sang admin.<domain>/gm. Bo cach do vi no dat GM vao
    # trang quan tri he thong — sai phan chia, va game thu hai se khong co cho de dat.
    #
    # KHONG dung tang PHP cu: no noi chuoi SQL thang tu $_GET/$_POST, chi chan bang mot
    # regex StopAttack() (CLAUDE.md muc 12). Ban Go dung truy van tham so hoa va ghi
    # admin_audit cho tung thao tac.
    # Dang nhap cong GM: vung chat rieng (12r/m) thay cho vung duyet trang.
    location = /admin-portal/dang-nhap {
        include /etc/nginx/admin_access.conf;
        limit_req zone=admin_login burst=5 nodelay;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/adapter_proxy.conf;
    }
    location ^~ /admin-portal {
        include /etc/nginx/admin_access.conf;
        # Cong GM phat vat pham, gui thu toan server, xoa kho do — khong duoc phep nhung
        # trong khung cua trang khac. Khoi `server` cua admin.<domain> co san header nay,
        # con khoi nay thi khong: header cua nginx KHONG ke thua giua cac khoi server.
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/adapter_proxy.conf;
    }
    # Bi danh khong gach noi: go nham kieu nao cung toi dung cho, thay vi roi vao
    # `location /` -> play.php -> chuyen huong sang /choi-game (rat kho hieu khi go nham).
    location ^~ /adminportal {
        include /etc/nginx/admin_access.conf;
        return 301 /admin-portal$is_args$args;
    }

    # ---- Cong cu GM cu (PHP) — CHI LOOPBACK ----
    # Con giu vi phan CDK (gmhanglong/cdk/, gmhanglong/pay/) chua co ban Go. Vao bang:
    #   ssh -L 8080:127.0.0.1:80 root@<server>   roi mo http://127.0.0.1:8080/gmhanglong/gm/
    # Muon mo lai ra Internet (KHONG khuyen nghi, xem ly do o tren): sua gm_access.conf.
    # Bang doanh thu PHP cu va lop trung gian cua no — CHI LOOPBACK.
    #
    # adminphp@2024/db.php kiem dang nhap bang `rowCount() < 0`, ma bieu thuc do KHONG BAO GIO
    # dung, nen ai mo trang cung vao duoc (CLAUDE.md muc 12). Do dang mo ra Internet: kiem
    # 2026-09-06 thay /adminphp@2024/ tra 200 tu ngoai trong khi /gm/ va /gmhanglong/ da 403.
    # Vai tro cua no (doanh thu) se do trang quan tri Go thay; /new/ thi cua hang Go da thay.
    location ^~ /adminphp@2024 {
        include /etc/nginx/gm_access.conf;
        try_files $uri $uri/ =404;
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9001;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }
    location ^~ /new/ {
        include /etc/nginx/gm_access.conf;
        try_files $uri $uri/ =404;
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9001;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }
    location ^~ /gmhanglong/ {
        include /etc/nginx/gm_access.conf;
        try_files $uri $uri/ =404;
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9001;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }
    location ^~ /gm/ {
        include /etc/nginx/gm_access.conf;
        try_files $uri $uri/ =404;
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9001;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }

    # khong lo file nhay cam
    location ~ /\.(user\.ini|htaccess|env|public-host) { deny all; }
    location ~ ^/(gm/user/log|gm/log|api/temp|api/id\.txt|_backup) { deny all; }
