# website/game — client H5 + cong nap + GM tool.
# Rewrite lay tu FILE NGINX GOC cua server cu (aaPanel):
#   /www/server/panel/vhost/rewrite/192.168.1.69.conf  (ban copy: www/server/panel/vhost/, gitignored)
#   /www/server/panel/vhost/nginx/192.168.1.69.conf    (server block goc: root /www/wwwroot/game, PHP 5.6)
# Server goc KHONG co rule cho /user/login.php|register.php|email.php|quenmatkhau.php (file khong
# ton tai -> 404); dang nhap/dang ky that di qua /user-mlogin, /user-mreg (user/login-reg.php).

server {
    listen 80 default_server;
    server_name _;
    root /www/wwwroot/game;
    index play.php index.php;
    charset utf-8;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/octet-stream;

    # ---- Adapter (Go, :8090) ----
    # Trang chu, danh sach may chu, quy doi va luong dang nhap OIDC do Adapter phuc vu:
    # so lieu tren do la SONG, den tu chinh bo dem tai ma cong gioi han dang dung.
    # Dung `=` va `^~` de cac duong nay thang truoc regex `\.php$` ben duoi; con
    # /api/config.php, /api/getSession.php... van roi ve PHP nhu cu.
    location = /            { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location = /may-chu     { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location = /quy-doi     { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location = /choi-game   { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location ^~ /auth/      { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }
    location ^~ /api/game/  { proxy_pass http://127.0.0.1:8090; include /etc/nginx/adapter_proxy.conf; }

    # ---- route dep: nguyen van rewrite goc cua server cu ----
    # Dat o muc server nen chay TRUOC khi chon location; "/" khong bi rewrite nen van ve Adapter.
    # /user-<act> va /act-<act> -> api/config.php?act=<act>: login-reg.php post /user-mlogin,
    # /user-mreg; taikhoan.php goi /act-pwd, /act-email; nhanxu.php /act-nhanxu; index.php /act-card.
    rewrite ^/play-game$        /play.php;
    rewrite ^/v2$               /hiente.php;
    rewrite ^/play.html$        /play.php;
    rewrite ^/user-(.*)$        /api/config.php?act=$1;
    rewrite ^/act-(.*)$         /api/config.php?act=$1;
    rewrite ^/get/(.*)$         /api/get.php?act=$1;        # dich khong co trong snapshot (404 nhu server cu)
    rewrite ^/gets/(.*)$        /api/gets.php?act=$1;       # nt
    rewrite ^/buy$              /api/buy.php;               # nt
    rewrite ^/tich$             /api/tich.php;              # nt
    rewrite ^/gift$             /api/giftcode.php;          # nt
    rewrite ^/card$             /api/card.php;
    rewrite ^/tai-khoan$        /user/index.php;
    rewrite ^/chinh-sach.html$  /dieukhoan.php;             # dich khong co; chinhsach.html thi co
    rewrite ^/lich-su$          /user/index.php?page=lichsu;
    rewrite ^/nhan-xu$          /user/index.php?page=nhanxu;
    rewrite ^/nap-tien$         /user/index.php?page=naptien;
    rewrite ^/doi-knb$          /user/index.php?page=doiknb;
    rewrite ^/tich-luy$         /user/index.php?page=tichluy;
    rewrite ^/web-shop$         /user/index.php?page=webshop;
    rewrite ^/webshop$          /user/index.php?page=webshop;    # bi danh them cua ban docker
    rewrite ^/gg_oauth$         /api/google_oauth/index.php;      # thu muc khong co trong snapshot
    rewrite ^/fb_oauth$         /api/facebook_oauth/index.php;    # nt
    rewrite ^/fb_callback$      /api/facebook_oauth/callback.php; # nt
    rewrite ^/oauth/(.*)$       /api/genSession.php?username=$1;  # file khong co trong snapshot
    location = /user        { rewrite ^ /user/index.php last; }

    # ---- 4 duong /user/*.php: khong ton tai tren server cu (404). Giu map tam ve config.php
    # vi user/index.php va indexapk.php van tham chieu chung; vo hai neu khong ai goi.
    location = /user/login.php       { rewrite ^ /api/config.php?act=login last; }
    location = /user/register.php    { rewrite ^ /api/config.php?act=reg   last; }
    location = /user/quenmatkhau.php { rewrite ^ /api/config.php?act=pwd   last; }
    location = /user/email.php       { rewrite ^ /api/config.php?act=email last; }

    # ---- tai nguyen client: cache dai, ten file da bam ----
    location ~* ^/(res|libs|spine|sound|bmFont|icon|iconshop|img)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|css|js|json|ttf|woff2?|wav|mp3|sk)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # getSession.php nhan mat khau qua query string (hop dong cua bundle client, chua
    # doi duoc). Tat access_log cho rieng duong dan nay de mat khau khong nam trong log.
    location = /api/getSession.php {
        access_log off;
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9001;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    # ---- PHP ----
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9001;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location / { try_files $uri $uri/ /play.php; }

    # khong lo file nhay cam
    location ~ /\.(user\.ini|htaccess|env|public-host) { deny all; }
    location ~ ^/(gm/user/log|gm/log|api/temp|api/id\.txt|_backup) { deny all; }
}
