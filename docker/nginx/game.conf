# website/game — client H5 + cong nap + GM tool.
# CANH BAO: file nginx goc khong co trong snapshot. Cac rewrite duoi day duoc suy ra tu
# ma PHP (user/index.php include "./$get[page].php", play.php la loader client).
# 4 endpoint AJAX /user/login.php|register.php|email.php|quenmatkhau.php KHONG ton tai
# dang file; map tam ve api/config.php?act=... — kiem tra lai khi chay thu.

server {
    listen 80 default_server;
    server_name _;
    root /www/wwwroot/game;
    index play.php index.php;
    charset utf-8;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/octet-stream;

    # ---- route dep ----
    location = /play-game   { rewrite ^ /play.php last; }
    location = /nap-tien    { rewrite ^ /user/index.php?page=naptien  last; }
    location = /tai-khoan   { rewrite ^ /user/index.php?page=taikhoan last; }
    location = /lich-su     { rewrite ^ /user/index.php?page=lichsu   last; }
    location = /tich-luy    { rewrite ^ /user/index.php?page=tichluy  last; }
    location = /doi-knb     { rewrite ^ /user/index.php?page=doiknb   last; }
    location = /webshop     { rewrite ^ /user/index.php?page=webshop  last; }
    location = /user        { rewrite ^ /user/index.php last; }

    # ---- 4 endpoint AJAX (suy doan, xem canh bao tren) ----
    location = /user/login.php       { rewrite ^ /api/config.php?act=login last; }
    location = /user/register.php    { rewrite ^ /api/config.php?act=reg   last; }
    location = /user/quenmatkhau.php { rewrite ^ /api/config.php?act=pwd   last; }
    location = /user/email.php       { rewrite ^ /api/config.php?act=email last; }

    # ---- tai nguyen client: cache dai, ten file da bam ----
    location ~* ^/(res|libs|spine|sound|bmFont|icon|iconshop|img)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|css|js|json|ttf|woff2?|wav|mp3|sk)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ---- PHP ----
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9001;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }

    location / { try_files $uri $uri/ /play.php; }

    # khong lo file nhay cam
    location ~ /\.(user\.ini|htaccess|env|public-host) { deny all; }
    location ~ ^/(gm/user/log|gm/log|api/temp|api/id\.txt|_backup) { deny all; }
}
