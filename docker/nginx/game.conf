# website/game — client H5 + cong nap + GM tool.
# Rewrite lay tu FILE NGINX GOC cua server cu (aaPanel):
#   /www/server/panel/vhost/rewrite/192.168.1.69.conf  (ban copy: www/server/panel/vhost/, gitignored)
#   /www/server/panel/vhost/nginx/192.168.1.69.conf    (server block goc: root /www/wwwroot/game, PHP 5.6)
# Server goc KHONG co rule cho /user/login.php|register.php|email.php|quenmatkhau.php (file khong
# ton tai -> 404); dang nhap/dang ky that di qua /user-mlogin, /user-mreg (user/login-reg.php).

# Chon dich cho path GOC theo header Upgrade.
#
# Dung `map` chu KHONG dung `if ($http_upgrade = ...) { proxy_pass ... }`: trong mot
# location da co proxy_pass, proxy_pass dat trong `if` khong co tac dung — da thu that,
# yeu cau WebSocket van roi ve Adapter va tra 200 thay vi 101 ("if is evil").
#
# Vi sao path goc: engine LayaAir ghep "ws://" + host + ":" + port, KHONG bao gio them
# path, nen client noi vao "/" chu khong phai "/game".
map $http_upgrade $op_goc_backend {
    default   http://127.0.0.1:8090;   # Adapter: trang chu
    websocket http://127.0.0.1:8001;   # tien trinh game: WebSocket
}
# Vung dem chong do mat khau cho cong cu GM (dung o gm_access.conf).
# 10m du cho ~160k dia chi. Dat o cap http vi limit_req_zone chi hop le o day.
limit_req_zone $binary_remote_addr zone=gm_login:10m rate=12r/m;

# Vung dem cho TRANG QUAN TRI NEN TANG (dung o admin_access.conf). Tach vung rieng voi
# gm_login de mot ben bi do khong lam khoa ben kia.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=12r/m;

# Dich cua /admin-portal tren host game. Trang quan tri la mot SPA phuc vu tu goc `/`, va
# index.html cua no tro toi /assets/... — ma tren host game thi /assets/ da thuoc ve client
# LayaAir. Proxy /admin-portal vao :8100 se lam trinh duyet xin /assets/index-*.js roi nhan
# 404 cua client. Nen o day chuyen huong sang chinh domain cua trang quan tri.
#
#   haitac.<domain>/admin-portal  ->  https://admin.<domain>/gm
#   <IP>/admin-portal             ->  http://127.0.0.1:8100/gm  (che do IP: vao bang
#                                     `ssh -L 8100:127.0.0.1:8100 root@<server>`)
map $host $op_admin_base {
    default                 "http://127.0.0.1:8100";
    "~^haitac\.(?<opdom>.+)$" "https://admin.$opdom";
}

map $http_upgrade $op_conn {
    default   "";
    websocket "upgrade";
}

server {
    listen 80 default_server;
    server_name _;
    # certbot --webroot: xin chung chi NGAY khi con chay che do IP (domains.conf can co chung chi
    # moi khoi dong duoc). Thu muc mount tu host (ACME_DIR, mac dinh /var/www/acme).
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type "text/plain"; }
    include /etc/nginx/game_site.conf;
}
