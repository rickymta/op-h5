# Ai duoc vao TRANG QUAN TRI NEN TANG (dich vu `admin`, React) qua nginx.
#
# YEU CAU CUA NGUOI VAN HANH (2026-09-06): mo hai cua qua HTTPS
#   https://admin.<domain>                  -> toan bo trang quan tri
#   https://haitac.<domain>/admin-portal    -> vao thang trang cong cu GM
#
# Truoc do trang nay CHI nghe loopback va vao bang `ssh -L 8100:127.0.0.1:8100`.
# Mo ra Internet la doi mot lop bao ve lay su tien loi, nen phai co du cac lop con lai:
#
#   1. `admin` van bind 127.0.0.1:8100 — nginx la duong vao duy nhat, khong ai goi thang duoc.
#   2. Mat khau bam Argon2id trong bang `admin_users`; dat ADMIN_PUBLIC=1 thi dich vu bat
#      dem so lan sai theo tai khoan va theo IP, rut han cookie, va TU CHOI KHOI DONG neu
#      tai khoan owner con dung mat khau mac dinh (mat khau do nam trong ma nguon cong khai).
#   3. Gioi han tan suat o duoi: chan do mat khau tu dong.
#   4. HTTPS bat buoc + HSTS (tls.conf), cookie Secure + SameSite=Strict.
#
# Muon siet lai chi mot dia chi co dinh (khuyen nghi khi da co IP tinh):
#   allow <IP cua ban>;
#   deny all;
allow all;

# Gioi han cho viec DUYET trang: 240 request/phut moi IP, don 60 request lien tiep. Mo mot
# trang quan tri la vai lenh goi API nen nguong phai roi; cho dang nhap thi khoi `server`
# ap them vung `admin_login` chat hon (12r/m) o dung duong do.
#
# Vung khai bao o cap http trong game.conf.
limit_req zone=admin_all burst=60 nodelay;
limit_req_status 429;
