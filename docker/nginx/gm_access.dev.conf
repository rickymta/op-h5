# Ban DEV cua gm_access.conf — CHI dung tren may lap trinh, KHONG dua len server.
#
# Tren macOS, request di qua proxy cua Docker Desktop nen nginx thay IP nguon la
# 172.17.0.1 chu khong phai 127.0.0.1; ban that se chan sach va khong test duoc gi.
# docker/dev-macos.sh mount file nay de len cho ban that.
allow 127.0.0.1;
allow ::1;
allow 172.16.0.0/12;   # mang bridge cua Docker
deny all;
