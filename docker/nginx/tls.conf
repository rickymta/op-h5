# Tham so TLS dung chung cho moi khoi `server` co domain.
#
# Duong dan chung chi theo bo cuc cua certbot. Mot chung chi duy nhat phu ca bon ten
# (SAN) nen moi khoi server deu tro vao cung mot cap file:
#
#   certbot certonly --webroot -w /var/www/acme \
#     -d __PUBLIC_DOMAIN__ -d www.__PUBLIC_DOMAIN__ \
#     -d id.__PUBLIC_DOMAIN__ -d haitac.__PUBLIC_DOMAIN__ -d admin.__PUBLIC_DOMAIN__
#
# LUU Y: nginx KHONG khoi dong duoc neu hai file nay chua ton tai. Xin chung chi TRUOC
# khi bat domains.conf — dung thu tu nguoc lai roi ngoi doan vi sao nginx chet.
ssl_certificate     /etc/letsencrypt/live/__PUBLIC_DOMAIN__/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_DOMAIN__/privkey.pem;

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;          # TLSv1.3 tu chon; de client quyet o 1.2
ssl_session_cache   shared:tcg_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# HSTS: bat tu 2026-09-06, khi ca nam ten deu chay HTTPS on dinh va co trang quan tri mo
# ra Internet (o do mot lan tut ve HTTP la mot lan lo cookie phien).
#
# CO Y KHONG dat `includeSubDomains`: chi thi do ap cho MOI sub domain, ke ca nhung ten
# chua ton tai, va trinh duyet nho no ca nam — mot sub domain moi chi chay HTTP se khong
# mo duoc va khong co cach go nhanh. Muon quay lai: doi max-age=0, doi trinh duyet cua
# nguoi dung ghe qua mot lan, roi moi bo dong nay.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
