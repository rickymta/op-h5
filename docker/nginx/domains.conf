# Domain that: __PUBLIC_DOMAIN__ va cac sub domain.   ---- CHUA BAT MAC DINH ----
#
# Bat bang cach dien __PUBLIC_DOMAIN__ roi mount file nay vao container nginx. Khong mount
# thi he thong chay theo IP nhu cu (game.conf, khoi `default_server`).
#
# SO DO
#   __PUBLIC_DOMAIN__                     -> trang chinh (he thong ID phuc vu `/`)
#   www.__PUBLIC_DOMAIN__                 -> chuyen huong ve ten khong co www
#   id.__PUBLIC_DOMAIN__                  -> quan ly tai khoan, nap tien, OIDC
#   haitac.__PUBLIC_DOMAIN__              -> game hai tac
#   haitac.__PUBLIC_DOMAIN__/adminportal  -> cong cu GM
#
# ---------------------------------------------------------------------------------
# CHI 80 VA 443 — client khong con goi theo cong
# ---------------------------------------------------------------------------------
# Ban goc client goi thang bon dich vu theo CONG: meta :12345, statistic :7788,
# login :9000, WebSocket :8001. Server chi mo 80/443 nen bon duong do khong toi noi; va
# khi trang chay HTTPS thi trinh duyet con chan noi dung hon hop, khong co duong lui.
#
# Nay ca bon di qua 443 bang tien to duong dan (dinh nghia trong game_site.conf):
#
#   /meta/   -> 127.0.0.1:12345    a3b31-4c087-1dc2f.js dung location.origin + "/meta/"
#   /stat/   -> 127.0.0.1:7788     nt, "/stat/"
#   /account/, /srv/ -> :9000      client noi vao base lay tu global.conf.json (loginNP)
#   /game    -> 127.0.0.1:8001     WebSocket; `path` do login server tra ve
#
# Ba viec BAT BUOC lam kem, neu khong client van goi cong cu:
#
#   1. server-entrypoint: dat PUBLIC_SCHEME=https (va PUBLIC_PORT neu khac 443). No sua
#      loginNP/statNP trong console/store/global.conf.json — client lay dia chi login tu
#      DAY chu khong phai tu tcg.srv_login.
#   2. Adapter: ADAPTER_TLS=true. Adapter phuc vu /srv/game/connect/target va viet lai
#      dia chi WebSocket thanh wss://<domain>:443/game. Khong the doi tcg.srv_game.ws_port
#      thanh 443 vi cot do cung la cong tien trinh game bind vao.
#   3. MySQL: UPDATE tcg.cloud_device SET host_WAN='haitac.__PUBLIC_DOMAIN__';
#
# CHUA KIEM CHUNG voi domain va chung chi that: tren may dev moi chay duoc `nginx -t` va
# thu toan bo duong dan qua HTTP o cong 8080 (client goi dung /meta/, /stat/, /srv/... va
# Adapter tra ve dung dia chi da viet lai).
#
# ---------------------------------------------------------------------------------
# DNS
# ---------------------------------------------------------------------------------
#   A   __PUBLIC_DOMAIN__          -> <IP server>
#   A   www.__PUBLIC_DOMAIN__      -> <IP server>
#   A   id.__PUBLIC_DOMAIN__       -> <IP server>
#   A   haitac.__PUBLIC_DOMAIN__   -> <IP server>
#
# Chung chi (chay TRUOC khi bat cac khoi 443 — thieu file la nginx khong khoi dong duoc):
#   certbot certonly --webroot -w /var/www/acme \
#     -d __PUBLIC_DOMAIN__ -d www.__PUBLIC_DOMAIN__ \
#     -d id.__PUBLIC_DOMAIN__ -d haitac.__PUBLIC_DOMAIN__

# ---- HTTP: chi de xac thuc ACME va day sang HTTPS ----
server {
    listen 80;
    server_name __PUBLIC_DOMAIN__ www.__PUBLIC_DOMAIN__ id.__PUBLIC_DOMAIN__ haitac.__PUBLIC_DOMAIN__;

    # Phai dat TRUOC redirect: certbot goi qua HTTP, chuyen huong se lam no that bai.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

# ---- Trang chinh ----
server {
    listen 443 ssl;
    http2 on;
    server_name __PUBLIC_DOMAIN__;
    include /etc/nginx/tls.conf;

    location / {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/adapter_proxy.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.__PUBLIC_DOMAIN__;
    include /etc/nginx/tls.conf;
    return 301 https://__PUBLIC_DOMAIN__$request_uri;
}

# ---- Quan ly tai khoan, nap tien ----
server {
    listen 443 ssl;
    http2 on;
    server_name id.__PUBLIC_DOMAIN__;
    include /etc/nginx/tls.conf;

    # /internal/ la API noi bo ky HMAC cho tang PHP goi qua loopback. Khong duoc mo ra
    # Internet: lo khoa la ai cung nap Xu duoc.
    location ^~ /internal/ { deny all; }

    location / {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/adapter_proxy.conf;
    }
}

# ---- Game hai tac ----
# game_site.conf mang toan bo: client, cac duong /meta//stat//account//srv//game thay cho
# cong truc tiep, /adminportal cho cong cu GM, va cac rewrite cu cua tang PHP.
server {
    listen 443 ssl;
    http2 on;
    server_name haitac.__PUBLIC_DOMAIN__;
    include /etc/nginx/tls.conf;
    include /etc/nginx/game_site.conf;
}
