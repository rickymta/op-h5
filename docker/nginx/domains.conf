# Domain that: __PUBLIC_DOMAIN__ va cac sub domain.   ---- CHUA BAT MAC DINH ----
#
# Bat bang cach dat PUBLIC_DOMAIN trong docker/.env; web-entrypoint se dien vao
# __PUBLIC_DOMAIN__ va mount file nay vao container nginx. Khong dat thi he thong chay
# theo IP nhu cu (game.conf, khoi `default_server`).
#
# SO DO
#   __PUBLIC_DOMAIN__            -> cong thong tin (he thong ID phuc vu `/`)
#   www.__PUBLIC_DOMAIN__        -> chuyen huong ve ten khong co www
#   id.__PUBLIC_DOMAIN__         -> he thong ID: dang ky, tai khoan, quen mat khau, OIDC
#   haitac.__PUBLIC_DOMAIN__     -> site game + client (/choi-game, /may-chu, /quy-doi)
#
# Trang quan tri CO Y khong co o day. No khong co lop chong do mat khau nhu he thong ID
# va mo ra Internet la mo ca duong nap tay. Vao bang SSH tunnel:
#   ssh -L 8100:127.0.0.1:8100 root@<server>   roi mo http://127.0.0.1:8100
#
# ---------------------------------------------------------------------------------
# TLS — DOC KY, day la cho de hong nhat
# ---------------------------------------------------------------------------------
# Client goi thang mot so dich vu THEO CONG, va scheme bam theo trang
# (a3b31-4c087-1dc2f.js: `location.protocol + "//" + location.hostname + ":12345/"`).
# Nghia la khi trang chay HTTPS thi client se goi https://haitac.../:12345 va
# wss://haitac.../:8001 — trinh duyet chan noi dung hon hop, khong co duong lui.
#
# Vi the phai boc TLS cho CA cac cong do, khong chi 443. Bon khoi `server` o cuoi file
# lam viec nay: 12345 (meta), 7788 (statistic), 9000 (login), 8001 (WebSocket game).
#
# Ngoai nginx con phai doi DU LIEU, neu khong login server van cong bo `ws://`:
#   UPDATE tcg.srv_login SET np_scheme='https', np_ssl=1, np_host_WAN='haitac.__PUBLIC_DOMAIN__';
#   UPDATE tcg.srv_game  SET ws_scheme='wss';
#   UPDATE tcg.cloud_device SET host_WAN='haitac.__PUBLIC_DOMAIN__';
# va trong .env:
#   PUBLIC_HOST=haitac.__PUBLIC_DOMAIN__
#   ID_ISSUER=https://id.__PUBLIC_DOMAIN__
#   ADAPTER_REDIRECT_URI=https://haitac.__PUBLIC_DOMAIN__/auth/callback
#   ADAPTER_TLS=true
#
# CHUA KIEM CHUNG: khong co domain that va chung chi tren may dev, moi kiem tra duoc
# `nginx -t`. Bon khoi cong phu (12345/7788/9000/8001) la suy ra tu cach client dung
# `location.protocol`, chua chay that lan nao.
#
# ---------------------------------------------------------------------------------
# DNS can tro
# ---------------------------------------------------------------------------------
#   A   __PUBLIC_DOMAIN__          -> <IP server>
#   A   www.__PUBLIC_DOMAIN__      -> <IP server>
#   A   id.__PUBLIC_DOMAIN__       -> <IP server>
#   A   haitac.__PUBLIC_DOMAIN__   -> <IP server>
# Them game moi thi them mot ban ghi A va mot khoi server nua (copy khoi haitac).
#
# Chung chi (chay TRUOC khi bat cac khoi 443, neu khong nginx khong khoi dong duoc):
#   certbot certonly --webroot -w /var/www/acme \
#     -d __PUBLIC_DOMAIN__ -d www.__PUBLIC_DOMAIN__ \
#     -d id.__PUBLIC_DOMAIN__ -d haitac.__PUBLIC_DOMAIN__

# ---- HTTP: chi de xac thuc ACME va day sang HTTPS ----
server {
    listen 80;
    server_name __PUBLIC_DOMAIN__ www.__PUBLIC_DOMAIN__ id.__PUBLIC_DOMAIN__ haitac.__PUBLIC_DOMAIN__;

    # Phai dat TRUOC redirect: certbot goi qua HTTP, chuyen huong se lam no that bai.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

# ---- Cong thong tin ----
server {
    listen 443 ssl;
    http2 on;
    server_name __PUBLIC_DOMAIN__;
    include /etc/nginx/tls.conf;

    location / {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/adapter_proxy.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.__PUBLIC_DOMAIN__;
    include /etc/nginx/tls.conf;
    return 301 https://__PUBLIC_DOMAIN__$request_uri;
}

# ---- He thong ID ----
server {
    listen 443 ssl;
    http2 on;
    server_name id.__PUBLIC_DOMAIN__;
    include /etc/nginx/tls.conf;

    # /internal/ la API noi bo ky HMAC cho tang PHP goi qua loopback. Khong duoc mo ra
    # Internet: lo khoa la ai cung nap Xu duoc.
    location ^~ /internal/ { deny all; }

    location / {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/adapter_proxy.conf;
    }
}

# ---- Game: haitac ----
server {
    listen 443 ssl;
    http2 on;
    server_name haitac.__PUBLIC_DOMAIN__;
    include /etc/nginx/tls.conf;
    include /etc/nginx/game_site.conf;
}

# ---------------------------------------------------------------------------------
# Bon cong client goi thang. Chi boc TLS roi chuyen tiep sang dich vu chay loopback.
# ---------------------------------------------------------------------------------
server {
    listen 12345 ssl;                       # meta
    server_name haitac.__PUBLIC_DOMAIN__;
    include /etc/nginx/tls.conf;
    location / { proxy_pass http://127.0.0.1:12345; include /etc/nginx/adapter_proxy.conf; }
}

server {
    listen 7788 ssl;                        # statistic
    server_name haitac.__PUBLIC_DOMAIN__;
    include /etc/nginx/tls.conf;
    location / { proxy_pass http://127.0.0.1:7788; include /etc/nginx/adapter_proxy.conf; }
}

server {
    listen 9000 ssl;                        # login
    server_name haitac.__PUBLIC_DOMAIN__;
    include /etc/nginx/tls.conf;
    location / { proxy_pass http://127.0.0.1:9000; include /etc/nginx/adapter_proxy.conf; }
}

server {
    listen 8001 ssl;                        # WebSocket cua tien trinh game s1
    server_name haitac.__PUBLIC_DOMAIN__;
    include /etc/nginx/tls.conf;

    location / {
        proxy_pass http://127.0.0.1:18001;  # xem ghi chu ve cong noi bo o game-ws.conf

        # Ba dong bat buoc cho WebSocket; thieu mot dong la bat tay that bai im lang.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Phien game keo dai; mac dinh 60s se cat ngang nguoi dang choi.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
