# Tran SO KET NOI THAT cho WebSocket cua tien trinh game.  ---- CHUA BAT MAC DINH ----
#
# VI SAO CAN
# ----------
# Cong chan tai o Adapter chi kiem soat viec CAP PHIEN. Client noi WebSocket THANG toi
# tien trinh game (ws://<host>:8001), khong di qua Adapter, nen:
#   - ai giu lai token cu co the noi lai ma khong xin phien moi;
#   - nguoi choi cu tu chon may chu trong client, Adapter khong chan duoc;
#   - va `srv_game.playerMax` thi khong tien trinh nao doc (da kiem chung trong bytecode).
# Nghia la trong hien tai la HANG RAO MEM. File nay bien no thanh rang buoc that.
#
# CACH LAM
# --------
# nginx dung o giua: nghe o cong CONG KHAI, chuyen tiep vao tien trinh game dang nghe
# o cong NOI BO, va dem so ket noi dong thoi bang limit_conn.
#
#   client ──ws──> nginx :8001 ──> game :18001 (chi loopback)
#
# BUOC BAT BUOC TRUOC KHI BAT
# ---------------------------
# 1. Doi cong WebSocket cua tien trinh game sang cong noi bo, TRONG MySQL `tcg.srv_game`
#    (khong phai file — xem CLAUDE.md muc 4). Tien trinh game doc cot nay de biet bind
#    vao dau.
# 2. Nhung dia chi login server CONG BO cho client phai van la cong cong khai. Neu
#    `srv_game` chi co MOT cot cong (dung cho ca bind lan cong bo) thi KHONG dung duoc
#    cach nay nguyen ban: khi do phai de Adapter ghi de cong trong `ws_url`, va sua client
#    de no dung `ws_url` cua Adapter thay vi dia chi tu `/srv/game/connect/target`.
#
# CHUA KIEM CHUNG DUOC diem 2: chua co dump `tcg` nen chua doc duoc schema `srv_game`,
# va chua co tien trinh game nao chay de thu. Dung file nay khi da co dump — doi chieu
# schema truoc, dung bat mo.
#
# BAT: them `include /etc/nginx/game-ws.conf;` o cap http, va mount file nay vao container
# nginx. Cac gia tri duoi day la vi du cho MOT may chu (s1); moi may chu mot khoi server.

# Vung dem: khoa theo dia chi IP. 10m du cho ~160k dia chi.
#
# Dem theo IP chu khong theo tai khoan vi o tang nay khong doc duoc token trong khung
# WebSocket. Hau qua phai biet: nhieu nguoi sau cung mot NAT (quan net, 4G) se dung chung
# han muc. Vi the day la tran CHONG LAM DUNG, dat cao hon nhieu so voi nguong trong trang
# quan tri — nguong nguoi choi van do Adapter lo.
limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;

# Tran tong cho ca may chu: dem moi ket noi bang mot khoa co dinh.
limit_conn_zone $server_name zone=ws_total:1m;

server {
    listen 8001;
    server_name game_s1;

    # 8 ket noi cho mot IP: du cho vai thiet bi trong nha, chan duoc script mo hang tram.
    limit_conn ws_per_ip 8;
    # Tran cung cua ca may chu. PHAI khop voi soft_limit * (100 + overflow_pct) / 100
    # trong trang quan tri, neu khong thi hai lop chan o hai muc khac nhau va rat kho lan.
    limit_conn ws_total 575;
    limit_conn_status 503;
    limit_conn_log_level warn;

    location / {
        proxy_pass http://127.0.0.1:18001;

        # Ba dong bat buoc cho WebSocket; thieu mot dong la bat tay that bai im lang.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Phien game keo dai; mac dinh 60s se cat ngang nguoi dang choi.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}
