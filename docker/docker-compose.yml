# Game server tcg — Docker Compose cho may 4 CPU / 8 GB RAM / 40 GB SSD.
#
# THIET KE
# - network_mode: host cho MOI container. Toan bo cau hinh (env.yml, global.conf.json,
#   va cac dong trong MySQL tcg.srv_game / cloud_server) deu tro 127.0.0.1, nen host
#   network la cach duy nhat khong phai sua cau hinh trong DB. Hau qua: port tren host
#   phai ranh (tat MySQL/Mongo/RabbitMQ/Java cu tren may truoc khi `up`).
# - Thu tu khoi dong = start.sh goc: console -> world -> meta -> statistic -> pay
#   -> group -> game -> login -> cross, bang depends_on + healthcheck.
# - Bo nho: -Xmx da cat so voi start script goc (tong Xmx goc ~8 GB, khong vua 8 GB RAM).
#   Neu service nao bao "GC overhead limit exceeded" hoac OOM-killed -> tang JAVA_XMX_*
#   trong .env len 128-256m, ha service khac xuong. Do bang `docker stats` sau khi len.
# - Cac service parse ~200 file Excel luc khoi dong (game/world/cross/group) -> peak
#   RAM luc do cao hon steady-state; khoi dong tuan tu nen peak khong chong len nhau.
#   Van nen tao swap 4 GB tren SSD (xem README) de tranh OOM-kill luc peak.
#
# Chay tu thu muc docker/:   docker compose up -d
# Xem log:                   docker compose logs -f game

x-java: &java
  image: eclipse-temurin:8-jre-jammy
  network_mode: host
  restart: unless-stopped
  environment: &java-env
    TZ: Asia/Ho_Chi_Minh
    JAVA_TOOL_OPTIONS: >-
      -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m
      -Xss512k -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=25
      -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom
      -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Ho_Chi_Minh
  volumes:
    - ${SERVER_DIR:-../server}:/h5/server
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-java-health: &java-health
  interval: 15s
  timeout: 5s
  retries: 40
  start_period: 90s

services:
  # ------------------------------------------------------------------ infra
  mysql:
    image: mysql:8.0
    network_mode: host
    restart: unless-stopped
    command: --defaults-extra-file=/etc/mysql/conf.d/tcg.cnf
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?dat trong .env, phai bang mat khau trong server/console/config/env.yml}
      # initdb/mysql/zz-init.sh (chi chay lan dau) nap seed/ khi khong co dump, roi ghi mat khau
      # Mongo/MQ/console + PUBLIC_HOST vao tcg.cloud_*/staff/cloud_device va them may chu theo GAME_SERVERS.
      MONGO_USER: ${MONGO_USER:-abc123}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?dat trong .env}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?dat trong .env}
      CONSOLE_ADMIN_PASSWORD: ${CONSOLE_ADMIN_PASSWORD:?dat trong .env — mat khau tai khoan admin cua console (tcg.staff)}
      PUBLIC_HOST: ${PUBLIC_HOST:?dat trong .env}
      GAME_SERVERS: ${GAME_SERVERS:-s1:8001:d1}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/tcg.cnf:/etc/mysql/conf.d/tcg.cnf:ro
      # Chi chay LAN DAU (volume trong): *.sql = dump that (gitignored, tuy chon); seed/*.sql = bo seed
      # sach trong git; zz-init.sh chon seed khi khong co dump va dien .env vao ca hai truong hop.
      - ./initdb/mysql:/docker-entrypoint-initdb.d:ro
    mem_limit: 768m
    mem_reservation: 384m
    cpu_shares: 768
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  mongo:
    image: mongo:4.4
    network_mode: host
    restart: unless-stopped
    # WiredTiger cache mac dinh = 50% RAM - 1GB -> phai ep nho.
    command: ["mongod", "--bind_ip", "127.0.0.1", "--auth", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-abc123}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?dat trong .env, phai bang mat khau mongo trong env.yml}
    volumes:
      - mongo-data:/data/db
      - ./initdb/mongo:/docker-entrypoint-initdb.d:ro   # restore.sh + thu muc dump/, chi chay lan dau
    mem_limit: 640m
    mem_reservation: 320m
    cpu_shares: 512
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.adminCommand(\"ping\").ok' 127.0.0.1/admin | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?dat trong .env, phai bang mat khau mq trong global.conf.json}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    mem_limit: 384m
    mem_reservation: 192m
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # ------------------------------------------------------------------ java
  console:
    <<: *java
    working_dir: /h5/server/console
    command: ["java", "-Xms128m", "-Xmx${JAVA_XMX_CONSOLE:-512m}", "-jar", "tcg-console-server-0.0.1-SNAPSHOT.jar"]
    mem_limit: 800m
    cpu_shares: 512
    depends_on:
      mysql: { condition: service_healthy }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:9999/"]

  world:
    <<: *java
    working_dir: /h5/server/world
    command: ["java", "-Xms128m", "-Xmx${JAVA_XMX_WORLD:-640m}", "-jar", "tcg-world-server-0.0.1-SNAPSHOT.jar"]
    mem_limit: 950m
    cpu_shares: 512
    depends_on: { console: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:10086/"]

  meta:
    <<: *java
    working_dir: /h5/server/meta
    command: ["java", "-Xms64m", "-Xmx${JAVA_XMX_META:-320m}", "-jar", "tcg-meta-0.0.1-SNAPSHOT.jar"]
    mem_limit: 560m
    cpu_shares: 256
    depends_on: { world: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:12345/"]

  statistic:
    <<: *java
    working_dir: /h5/server/statistic
    command: ["java", "-Xms128m", "-Xmx${JAVA_XMX_STATISTIC:-512m}", "-jar", "tcg-stat-server-0.0.1-SNAPSHOT.jar"]
    mem_limit: 800m
    cpu_shares: 256
    depends_on: { meta: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:7788/"]

  pay:
    <<: *java
    working_dir: /h5/server/pay
    command: ["java", "-Xms128m", "-Xmx${JAVA_XMX_PAY:-384m}", "-jar", "tcg-pay-server-0.0.1-SNAPSHOT.jar"]
    mem_limit: 640m
    cpu_shares: 256
    depends_on: { statistic: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:10010/"]

  group:
    <<: *java
    working_dir: /h5/server/group
    # start goc dung -Xmx512m va OOM ("GC overhead limit exceeded"); DB ghi 1128m.
    command: ["java", "-Xms128m", "-Xmx${JAVA_XMX_GROUP:-640m}", "-jar", "tcg-group.jar", "--v=0", "--gc=group-offical", "--p=30001"]
    mem_limit: 950m
    cpu_shares: 512
    depends_on: { pay: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:30001/"]

  game:
    <<: *java
    working_dir: /h5/server/game
    command: ["java", "-Xms256m", "-Xmx${JAVA_XMX_GAME:-1024m}", "-jar", "tcg-game.jar", "--v=0", "--sc=${GAME_SRV_CODE:-s1}"]
    mem_limit: 1400m
    mem_reservation: 768m
    cpu_shares: 1024
    depends_on: { group: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      start_period: 150s
      # 8001 la port WebSocket (Netty), khong tra loi HTTP -> van dung TCP connect.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8001'"]
  # Them game server thu 2: copy khoi `game`, doi ten `game2`, --sc=s2, port health theo
  # wsPort cua s2 trong tcg.srv_game, va depends_on: { game: { condition: service_healthy } }.
  # Moi game server them ~1.2 GB RAM: voi 8 GB chi nen chay 1.

  login:
    <<: *java
    working_dir: /h5/server/login
    command: ["java", "-Xms64m", "-Xmx${JAVA_XMX_LOGIN:-320m}", "-jar", "tcg-login-server-0.0.1-SNAPSHOT.jar"]
    mem_limit: 560m
    cpu_shares: 256
    depends_on: { game: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:9000/"]

  cross:
    <<: *java
    working_dir: /h5/server/cross
    command: ["java", "-Xms128m", "-Xmx${JAVA_XMX_CROSS:-640m}", "-jar", "tcg-cross.jar", "--v=0", "--cc=cross-yzx1", "--p=20001"]
    mem_limit: 950m
    cpu_shares: 512
    depends_on: { login: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:20001/"]

  # ------------------------------------------------------------------ web (client + cong nap + GM)
  php:
    # Dockerfile COPY tu goc repo (website/game, docker/...) -> context phai la thu muc cha.
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    network_mode: host          # php-fpm nghe 127.0.0.1:9001 (9000 da bi login server dung)
    restart: unless-stopped
    env_file: .env              # web-entrypoint can PUBLIC_HOST + cac secret PHP
    environment: { TZ: Asia/Ho_Chi_Minh }
    volumes:
      - ${WEBSITE_DIR:-../website}/game:/www/wwwroot/game
      - ./php/www.conf:/usr/local/etc/php-fpm.d/zz-tcg.conf:ro
    mem_limit: 192m
    cpu_shares: 256
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  nginx:
    image: nginx:1.25-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${WEBSITE_DIR:-../website}/game:/www/wwwroot/game:ro
      - ./nginx/game.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/adapter_proxy.conf:/etc/nginx/adapter_proxy.conf:ro
    depends_on: [php]
    mem_limit: 96m
    cpu_shares: 256
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

volumes:
  mysql-data:
  mongo-data:
  rabbitmq-data:
