# PHUONG AN 2: server chi PULL image tu GHCR, khong can upload JAR/Excel/PHP.
# (Phuong an 1 - upload cay thu muc + bind mount - la docker-compose.yml.)
#
# Tren server:
#   cd /opt/tcg/docker && cp .env.example .env && nano .env     # dien secrets + PUBLIC_HOST
#   docker compose -f docker-compose.image.yml pull
#   docker compose -f docker-compose.image.yml up -d          # gom ca id/adapter/admin/platform-seed
#
# Bat buoc co san tren host (khong nam trong image):
#   /opt/tcg/res/            <- website/game/res (1.5 GB) + sound/ + spine/, upload 1 lan bang WinSCP
#   docker/initdb/mysql/*.sql, docker/initdb/mongo/dump/   <- dump tu server cu (lan dau)
#
# Bo nho/CPU/network giong docker-compose.yml (host network, heap da cat cho may 8 GB).

x-java: &java
  image: ${IMAGE_SERVER:-ghcr.io/rickymta/op-h5-server:latest}
  network_mode: host
  restart: unless-stopped
  env_file: .env
  environment:
    TZ: Asia/Ho_Chi_Minh
  # log file cua logback nam trong /h5/server/<svc>/.logs ben trong container:
  #   docker compose -f docker-compose.image.yml exec game tail -f .logs/game-s1/info.log
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-java-health: &java-health
  interval: 15s
  timeout: 5s
  retries: 40
  start_period: 90s

services:
  mysql:
    image: mysql:8.0
    network_mode: host
    restart: unless-stopped
    command: --defaults-extra-file=/etc/mysql/conf.d/tcg.cnf
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?dat trong .env}
      # initdb/mysql/zz-init.sh (chi chay lan dau) nap seed/ khi khong co dump, roi ghi mat khau
      # Mongo/MQ/console + PUBLIC_HOST vao tcg.cloud_*/staff/cloud_device va them may chu theo GAME_SERVERS.
      MONGO_USER: ${MONGO_USER:-abc123}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?dat trong .env}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?dat trong .env}
      CONSOLE_ADMIN_PASSWORD: ${CONSOLE_ADMIN_PASSWORD:?dat trong .env — mat khau tai khoan admin cua console (tcg.staff)}
      PUBLIC_HOST: ${PUBLIC_HOST:?dat trong .env}
      GAME_SERVERS: ${GAME_SERVERS:-s1:8001:d1}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/tcg.cnf:/etc/mysql/conf.d/tcg.cnf:ro
      # Chi chay LAN DAU (volume trong): *.sql = dump that (gitignored, tuy chon); seed/*.sql = bo seed
      # sach trong git; zz-init.sh chon seed khi khong co dump va dien .env vao ca hai truong hop.
      - ./initdb/mysql:/docker-entrypoint-initdb.d:ro
    mem_limit: 768m
    mem_reservation: 384m
    cpu_shares: 768
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  mongo:
    image: mongo:4.4
    network_mode: host
    restart: unless-stopped
    command: ["mongod", "--bind_ip", "127.0.0.1", "--auth", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-abc123}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?dat trong .env}
    volumes:
      - mongo-data:/data/db
      - ./initdb/mongo:/docker-entrypoint-initdb.d:ro
    mem_limit: 640m
    mem_reservation: 320m
    cpu_shares: 512
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.adminCommand(\"ping\").ok' 127.0.0.1/admin | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?dat trong .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    mem_limit: 384m
    mem_reservation: 192m
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  console:
    <<: *java
    # `build:` chi dat o console: `docker compose build` dung 1 lan, cac service Java khac
    # dung lai image cung ten. Khong co Docker o may dev thi bo qua build, `pull` tu GHCR.
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    working_dir: /h5/server/console
    command: ["java", "-Xms128m", "-Xmx${JAVA_XMX_CONSOLE:-512m}", "-jar", "tcg-console-server-0.0.1-SNAPSHOT.jar"]
    mem_limit: 800m
    cpu_shares: 512
    depends_on:
      mysql: { condition: service_healthy }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:9999/"]

  world:
    <<: *java
    working_dir: /h5/server/world
    command: ["java", "-Xms128m", "-Xmx${JAVA_XMX_WORLD:-640m}", "-jar", "tcg-world-server-0.0.1-SNAPSHOT.jar"]
    mem_limit: 950m
    cpu_shares: 512
    depends_on: { console: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:10086/"]

  meta:
    <<: *java
    working_dir: /h5/server/meta
    command: ["java", "-Xms64m", "-Xmx${JAVA_XMX_META:-320m}", "-jar", "tcg-meta-0.0.1-SNAPSHOT.jar"]
    mem_limit: 560m
    cpu_shares: 256
    depends_on: { world: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:12345/"]

  statistic:
    <<: *java
    working_dir: /h5/server/statistic
    command: ["java", "-Xms128m", "-Xmx${JAVA_XMX_STATISTIC:-512m}", "-jar", "tcg-stat-server-0.0.1-SNAPSHOT.jar"]
    mem_limit: 800m
    cpu_shares: 256
    depends_on: { meta: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:7788/"]

  pay:
    <<: *java
    working_dir: /h5/server/pay
    command: ["java", "-Xms128m", "-Xmx${JAVA_XMX_PAY:-384m}", "-jar", "tcg-pay-server-0.0.1-SNAPSHOT.jar"]
    mem_limit: 640m
    cpu_shares: 256
    depends_on: { statistic: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:10010/"]

  group:
    <<: *java
    working_dir: /h5/server/group
    command: ["java", "-Xms128m", "-Xmx${JAVA_XMX_GROUP:-640m}", "-jar", "tcg-group.jar", "--v=0", "--gc=group-offical", "--p=30001"]
    mem_limit: 950m
    cpu_shares: 512
    depends_on: { pay: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:30001/"]

  game:
    <<: *java
    working_dir: /h5/server/game
    command: ["java", "-Xms256m", "-Xmx${JAVA_XMX_GAME:-1024m}", "-jar", "tcg-game.jar", "--v=0", "--sc=${GAME_SRV_CODE:-s1}"]
    mem_limit: 1400m
    mem_reservation: 768m
    cpu_shares: 1024
    depends_on: { group: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      start_period: 150s
      # 8001 la port WebSocket (Netty), khong tra loi HTTP -> van dung TCP connect.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8001'"]

  login:
    <<: *java
    working_dir: /h5/server/login
    command: ["java", "-Xms64m", "-Xmx${JAVA_XMX_LOGIN:-320m}", "-jar", "tcg-login-server-0.0.1-SNAPSHOT.jar"]
    mem_limit: 560m
    cpu_shares: 256
    depends_on: { game: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:9000/"]

  cross:
    <<: *java
    working_dir: /h5/server/cross
    command: ["java", "-Xms128m", "-Xmx${JAVA_XMX_CROSS:-640m}", "-jar", "tcg-cross.jar", "--v=0", "--cc=cross-yzx1", "--p=20001"]
    mem_limit: 950m
    cpu_shares: 512
    depends_on: { login: { condition: service_healthy } }
    healthcheck:
      <<: *java-health
      test: ["CMD-SHELL", "curl -fsS -m 5 -o /dev/null http://127.0.0.1:20001/"]

  php:
    image: ${IMAGE_PHP:-ghcr.io/rickymta/op-h5-php:latest}
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment: { TZ: Asia/Ho_Chi_Minh }
    volumes:
      - ${ASSETS_DIR:-/opt/tcg/assets}/res:/www/wwwroot/game/res:ro
      - ${ASSETS_DIR:-/opt/tcg/assets}/sound:/www/wwwroot/game/sound:ro
      - ${ASSETS_DIR:-/opt/tcg/assets}/spine:/www/wwwroot/game/spine:ro
      - web-runtime:/www/wwwroot/game/api/temp
    mem_limit: 192m
    cpu_shares: 256
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  nginx:
    image: ${IMAGE_NGINX:-ghcr.io/rickymta/op-h5-nginx:latest}
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${ASSETS_DIR:-/opt/tcg/assets}/res:/www/wwwroot/game/res:ro
      - ${ASSETS_DIR:-/opt/tcg/assets}/sound:/www/wwwroot/game/sound:ro
      - ${ASSETS_DIR:-/opt/tcg/assets}/spine:/www/wwwroot/game/spine:ro
    depends_on: [php]
    mem_limit: 96m
    cpu_shares: 256
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  # ---- Nen tang (platform/: Go) — ban IMAGE, khong build. Cung noi dung voi
  # docker-compose.platform.yml (file do them `build:`); sua mot noi thi sua noi kia.
  # id :8080 (cong khai, OIDC), adapter 127.0.0.1:8090 (nginx proxy), admin 127.0.0.1:8100 (SSH tunnel),
  # platform-seed: tao DB `platform` + seed oauth_clients/games/game_servers/game_devices/game_packages.
  # Tao DB `platform`, doi migration cua `id` chay xong, roi ghi (upsert, chay lai duoc):
  # oauth_clients (client cua game), games, game_devices + game_servers (tu tcg.srv_game),
  # game_packages (docker/platform-seed/game_packages.<game>.sql). Tai khoan quan tri dau
  # tien do `admin` tu tao tu ADMIN_BOOTSTRAP_USER/PASSWORD.
  platform-seed:
    image: mysql:8.0
    network_mode: host
    restart: "no"
    entrypoint: ["bash", "/seed/platform-seed.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?dat trong .env}
      ID_DB_NAME: ${ID_DB_NAME:-platform}
      ADAPTER_GAME_CODE: ${ADAPTER_GAME_CODE:-haitac}
      ADAPTER_GAME_NAME: ${ADAPTER_GAME_NAME:-Đại Hải Trình}
      ADAPTER_CLIENT_ID: ${ADAPTER_CLIENT_ID:-haitac}
      ADAPTER_REDIRECT_URI: ${ADAPTER_REDIRECT_URI:?dat trong .env — vd http://<PUBLIC_HOST>/auth/callback}
      ADAPTER_PORT: ${ADAPTER_PORT:-8090}
      ADAPTER_SITE_URL: ${ADAPTER_SITE_URL:-}
      GAME_SERVERS: ${GAME_SERVERS:-s1:8001:d1}
    volumes:
      - ./platform-seed.sh:/seed/platform-seed.sh:ro
      - ./platform-seed:/seed/data:ro
    depends_on:
      mysql: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  id:
    image: ${IMAGE_ID:-ghcr.io/rickymta/op-h5-id:latest}
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      ID_ADDR: ":${ID_PORT:-8080}"
      ID_ISSUER: ${ID_ISSUER:?dat trong .env — URL cong khai cua he thong ID, vd http://<PUBLIC_HOST>:8080}
      ID_DB_HOST: "127.0.0.1"
      ID_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?dat trong .env}
      ID_DB_NAME: ${ID_DB_NAME:-platform}
      ID_SIGNING_KEY_PEM: ${ID_SIGNING_KEY_PEM:?sinh bang `openssl genrsa 2048`, dat trong .env}
      ID_COOKIE_SECURE: ${ID_COOKIE_SECURE:-true}
      ID_INTERNAL_SECRET: ${ID_INTERNAL_SECRET:-}
      ID_SMTP_HOST: ${ID_SMTP_HOST:-}
      ID_SMTP_PORT: ${ID_SMTP_PORT:-587}
      ID_SMTP_USER: ${ID_SMTP_USER:-}
      ID_SMTP_PASSWORD: ${ID_SMTP_PASSWORD:-}
      ID_SMTP_FROM: ${ID_SMTP_FROM:-}
      ID_SMTP_FROM_NAME: ${ID_SMTP_FROM_NAME:-Cổng game}
    depends_on:
      mysql: { condition: service_healthy }
    mem_limit: 128m
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${ID_PORT:-8080}/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  adapter:
    image: ${IMAGE_ADAPTER:-ghcr.io/rickymta/op-h5-adapter:latest}
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Chi nghe loopback: nginx proxy /, /may-chu, /quy-doi, /choi-game, /auth/, /api/game/ vao day.
      ADAPTER_ADDR: "127.0.0.1:${ADAPTER_PORT:-8090}"
      ADAPTER_GAME_CODE: ${ADAPTER_GAME_CODE:-haitac}
      ADAPTER_GAME_ID: ${ADAPTER_GAME_ID:-10091}
      ADAPTER_PLATFORM_CODE: ${ADAPTER_PLATFORM_CODE:-id}
      ADAPTER_CHANNEL_CODE: ${ADAPTER_CHANNEL_CODE:-web}
      ADAPTER_CURRENCY_CODE: ${ADAPTER_CURRENCY_CODE:-VND}
      ID_DB_HOST: "127.0.0.1"
      ID_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?dat trong .env}
      ID_DB_NAME: ${ID_DB_NAME:-platform}
      ADAPTER_ISSUER: ${ID_ISSUER:?dat trong .env}
      ADAPTER_CLIENT_ID: ${ADAPTER_CLIENT_ID:-haitac}
      ADAPTER_CLIENT_SECRET: ${ADAPTER_CLIENT_SECRET:-}
      ADAPTER_REDIRECT_URI: ${ADAPTER_REDIRECT_URI:?dat trong .env — platform-seed ghi cung gia tri vao oauth_clients}
      ADAPTER_LOGIN_BASE_URL: "http://127.0.0.1:9000"
      TCG_SECRET: ${TCG_SECRET:?dat trong .env — phai bang secret trong env.yml}
      ADAPTER_SECRET_ENC_KEY: ${ADAPTER_SECRET_ENC_KEY:?sinh bang `head -c 32 /dev/urandom | base64`}
      # Console :9999 — adapter dang nhap /staff/login de phat vat pham (/gm/pay/*).
      # Cung tai khoan admin ma gmhanglong dung (tcg.staff), nen mat khau la CONSOLE_ADMIN_PASSWORD.
      ADAPTER_CONSOLE_BASE_URL: "http://127.0.0.1:9999"
      ADAPTER_CONSOLE_USER: ${ADAPTER_CONSOLE_USER:-admin}
      ADAPTER_CONSOLE_PASSWORD: ${CONSOLE_ADMIN_PASSWORD:?dat trong .env — mat khau tai khoan admin cua console (tcg.staff)}
      ADAPTER_CONSOLE_PAY_MODE: ${ADAPTER_CONSOLE_PAY_MODE:-manual}
      ADAPTER_GRANT_INTERVAL: ${ADAPTER_GRANT_INTERVAL:-15s}
      ADAPTER_PUBLIC_HOST: ${PUBLIC_HOST:?dat trong .env}
      ADAPTER_TLS: ${ADAPTER_TLS:-false}
      ADAPTER_POLL_INTERVAL: ${ADAPTER_POLL_INTERVAL:-10s}
      ADAPTER_TICKET_TTL: ${ADAPTER_TICKET_TTL:-60s}
    depends_on:
      id: { condition: service_healthy }
      platform-seed: { condition: service_completed_successfully }
      login: { condition: service_healthy }
    mem_limit: 128m
    cpu_shares: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${ADAPTER_PORT:-8090}/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # Trang quan tri nen tang (doi server, nguong tai, nap tay, nhat ky). Chi loopback:
  # vao bang SSH tunnel  ssh -L 8100:127.0.0.1:8100 root@<server>  roi mo http://127.0.0.1:8100
  admin:
    image: ${IMAGE_ADMIN:-ghcr.io/rickymta/op-h5-admin:latest}
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      ADMIN_ADDR: ${ADMIN_ADDR:-127.0.0.1:8100}
      ID_DB_HOST: "127.0.0.1"
      ID_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?dat trong .env}
      ID_DB_NAME: ${ID_DB_NAME:-platform}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    depends_on:
      id: { condition: service_healthy }
    mem_limit: 96m
    cpu_shares: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://${ADMIN_ADDR:-127.0.0.1:8100}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  mysql-data:
  mongo-data:
  rabbitmq-data:
  web-runtime:
