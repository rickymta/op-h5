name: build-images

# Build 6 image (server / php / nginx + id / adapter / admin cua platform/) va day len GHCR.
# Server chi can `docker compose pull`.
#
# LFS: 8 fat JAR (611 MB) la LFS object. Free plan chi co 1 GB bandwidth/thang, nen LFS
# duoc cache trong Actions cache (10 GB/repo) — chi lan build dau tien ton bandwidth.
#
# Chay tay: Actions -> build-images -> Run workflow. Tu dong: moi push vao main cham toi
# server/, website/game/, docker/.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'website/game/**'
      - 'docker/**'
      - 'platform/**'
      - 'web/**'
      - '.dockerignore'
      - '.github/workflows/build-images.yml'

concurrency:
  group: build-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (khong keo LFS ngay)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Danh sach LFS object -> key cache
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        id: lfs-cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Keo LFS (chi khi cache miss) va checkout file that
        run: |
          git lfs pull
          git lfs checkout
          ls -la server/statistic/*.jar server/game/tcg-game.jar

      - name: Dung tag
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/op-h5-server:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/op-h5-server:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build & push php
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/op-h5-php:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/op-h5-php:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php

      - name: Build & push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/op-h5-nginx:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/op-h5-nginx:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      # ---- giao dien React: build TRUOC image Go, vi `go:embed all:dist` nhung ban build ----
      # Bo qua khi khong co thay doi nao trong web/ ? Khong: dist/ khong nam trong git, nen
      # moi lan build image deu phai co ban build moi, khong thi binary nhung .gitkeep rong.
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 5 app: 2 quan tri (MUI) + 3 cong khai (Tailwind). `npm run build` cua web/ chay ca 5.
      - name: Build giao dien React (5 app)
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
          ls -la ../platform/cmd/admin/dist ../platform/cmd/admin/dist-gm \
                 ../platform/cmd/id/dist ../platform/cmd/id/dist-market \
                 ../platform/cmd/adapter/dist

      # Ba binary Go nhung NAM thu muc build bang go:embed (admin: dist + dist-gm; id: dist +
      # dist-market; adapter: dist). Thu muc chi co .gitkeep van build duoc, va binary do chay
      # duoc — no chi tra mot trang 503 "Chua build giao dien" thay cho toan bo giao dien. Da
      # dinh that ngay 2026-09-06: image day len GHCR nhung rong, server pull ve la ca ba trang
      # trang. Nen chan o day thay vi phat hien ngoai san xuat.
      - name: Chan image rong — moi dist phai co index.html
        run: |
          for d in admin/dist admin/dist-gm id/dist id/dist-market adapter/dist; do
            f="platform/cmd/$d/index.html"
            test -s "$f" || { echo "::error::$f rong hoac khong co — buoc build React da that bai"; exit 1; }
            grep -q 'src="/' "$f" || { echo "::error::$f khong tro toi tai san nao"; exit 1; }
          done
          echo "ca 5 app deu co index.html"


      # ---- nen tang (Go): context la platform/, mot Dockerfile, chon binary bang ARG CMD ----
      - name: Build & push id
        uses: docker/build-push-action@v6
        with:
          context: platform
          file: platform/Dockerfile
          build-args: CMD=id
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/op-h5-id:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/op-h5-id:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=platform-id
          cache-to: type=gha,mode=max,scope=platform-id

      - name: Build & push adapter
        uses: docker/build-push-action@v6
        with:
          context: platform
          file: platform/Dockerfile
          build-args: CMD=adapter
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/op-h5-adapter:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/op-h5-adapter:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=platform-adapter
          cache-to: type=gha,mode=max,scope=platform-adapter

      - name: Build & push admin
        uses: docker/build-push-action@v6
        with:
          context: platform
          file: platform/Dockerfile
          build-args: CMD=admin
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/op-h5-admin:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/op-h5-admin:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=platform-admin
          cache-to: type=gha,mode=max,scope=platform-admin

      - name: Tom tat
        run: |
          echo "### Image da day len GHCR" >> "$GITHUB_STEP_SUMMARY"
          for i in server php nginx id adapter admin; do
            echo "- \`${REGISTRY}/${{ steps.meta.outputs.owner_lc }}/op-h5-$i:${{ steps.meta.outputs.sha }}\` (+ latest)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Lan dau: vao Packages -> op-h5-server/php/nginx/id/adapter/admin -> Package settings -> Change visibility -> Public, de server pull khong can login." >> "$GITHUB_STEP_SUMMARY"
